<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8f4fa">
<meta name="description" content="シンプルなスマートフォンタイマー">
<title>タイマー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23f7fcff' stroke='%237eb6d0' stroke-width='6'/%3E%3Cpath d='M32 28h36l-18 22 18 22H32l18-22z' fill='none' stroke='%237eb6d0' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='50' r='3' fill='%237eb6d0'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #e8f4fa;
    --bg-elevated: #f7fcff;
    --bg-press: #d7ebf5;
    --text: #2f3b45;
    --text-muted: #5a6b78;
    --accent: #7eb6d0;
    --accent-soft: rgba(126, 182, 208, 0.22);
    --accent-deep: #5a96b0;
    --danger: #c48a7a;
    --danger-soft: rgba(196, 138, 122, 0.16);
    --ok: #6fa8c0;
    --ok-soft: rgba(111, 168, 192, 0.2);
    --shadow: rgba(70, 100, 120, 0.1);
    --shadow-strong: rgba(70, 100, 120, 0.14);
    --radius: 20px;
    --radius-sm: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif;
    line-height: 1.4;
    overflow: hidden;
  }

  body {
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 480px;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(16px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
    position: relative;
  }

  .view {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  .view.active {
    display: flex;
  }

  .title-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
    flex-shrink: 0;
  }

  .title-icon {
    width: 28px;
    height: 28px;
    opacity: 0.7;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    color: var(--text);
    text-align: center;
    margin-bottom: 28px;
    flex-shrink: 0;
  }

  .title-wrap h1 {
    margin-bottom: 0;
    padding-left: 0.28em;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .header-row h1 {
    margin: 0;
    flex: 1;
    font-size: 1.15rem;
    letter-spacing: 0.12em;
    padding-left: 0.12em;
  }

  .btn {
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    background: var(--bg-elevated);
    box-shadow: 0 2px 10px var(--shadow), 0 1px 2px rgba(60, 50, 40, 0.04);
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    min-height: 48px;
    padding: 12px 20px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .btn:active {
    transform: scale(0.97);
    background: var(--bg-press);
    box-shadow: 0 1px 4px var(--shadow);
  }

  .btn-ghost {
    background: transparent;
    box-shadow: none;
    color: var(--text);
    font-weight: 700;
    font-size: 1.05rem;
    min-width: 72px;
  }

  .btn-ghost:active {
    background: var(--bg-press);
    box-shadow: none;
  }

  .btn-accent {
    background: var(--accent-soft);
    color: var(--accent-deep);
    box-shadow: 0 2px 8px rgba(143, 175, 154, 0.2);
  }

  .btn-danger {
    background: var(--danger-soft);
    color: var(--danger);
    box-shadow: 0 2px 8px rgba(196, 138, 122, 0.15);
  }

  .btn-ok {
    background: var(--ok-soft);
    color: var(--ok);
    box-shadow: 0 2px 8px rgba(122, 158, 136, 0.18);
  }

  .btn-icon {
    width: 44px;
    height: 44px;
    min-height: 44px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    border-radius: var(--radius-sm);
    box-shadow: 0 1px 4px var(--shadow);
  }

  .presets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    flex: 1;
    align-content: center;
    padding: 8px 0 28px;
  }

  .preset-btn {
    font-size: 1.85rem;
    font-weight: 600;
    min-height: 88px;
    letter-spacing: 0.04em;
    background: var(--bg-elevated);
    border-radius: 22px;
    box-shadow: 0 4px 16px var(--shadow), 0 1px 3px rgba(60, 50, 40, 0.05);
    color: var(--text);
  }

  .preset-btn:active {
    background: var(--bg-press);
    box-shadow: 0 2px 8px var(--shadow);
  }

  .top-actions {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }

  .top-actions .btn {
    flex: 1;
    font-size: 1.08rem;
    font-weight: 700;
    color: var(--text);
    background: var(--bg-elevated);
    box-shadow: 0 2px 10px var(--shadow);
    border: 1.5px solid rgba(126, 182, 208, 0.35);
    border-radius: 16px;
  }

  .top-actions .btn:active {
    background: var(--bg-press);
    box-shadow: none;
  }

  #view-running {
    justify-content: space-between;
    align-items: center;
  }

  .running-deco {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.45;
  }

  .running-deco svg {
    width: 22px;
    height: 22px;
  }

  .time-display {
    font-size: 4.75rem;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
    text-align: center;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    color: var(--text);
  }

  .time-display.paused {
    color: var(--text-muted);
  }

  .running-actions {
    display: flex;
    gap: 12px;
    width: 100%;
    flex-shrink: 0;
  }

  .running-actions .btn {
    flex: 1;
    min-height: 56px;
    font-size: 1.05rem;
    border-radius: 18px;
  }

  #view-alarm {
    justify-content: center;
    align-items: center;
    gap: 28px;
  }

  .alarm-icon {
    width: 56px;
    height: 56px;
    opacity: 0.85;
  }

  .alarm-label {
    font-size: 1.45rem;
    color: var(--accent-deep);
    font-weight: 500;
    letter-spacing: 0.08em;
    animation: softPulse 1.6s ease-in-out infinite;
  }

  .alarm-zero {
    font-size: 4.5rem;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: var(--text);
  }

  #btn-alarm-stop {
    width: 100%;
    max-width: 280px;
    min-height: 64px;
    font-size: 1.25rem;
    border-radius: 20px;
    margin-top: 12px;
  }

  @keyframes softPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  #view-custom {
    justify-content: center;
  }

  .custom-form {
    display: flex;
    flex-direction: column;
    gap: 28px;
    align-items: center;
  }

  .inputs-row {
    display: flex;
    gap: 16px;
    align-items: flex-end;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }

  .input-group label {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .input-group input {
    width: 96px;
    height: 64px;
    font-size: 1.75rem;
    text-align: center;
    border: 2px solid rgba(138, 133, 124, 0.22);
    border-radius: var(--radius);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    outline: none;
    box-shadow: 0 2px 8px var(--shadow);
    -moz-appearance: textfield;
  }

  .input-group input::-webkit-outer-spin-button,
  .input-group input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .input-group input:focus {
    border-color: var(--accent);
  }

  .custom-actions {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .custom-actions .btn {
    flex: 1;
    min-height: 56px;
    border-radius: 18px;
  }

  #view-settings {
    overflow: hidden;
  }

  .settings-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 12px;
    min-height: 0;
  }

  .settings-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-elevated);
    border-radius: var(--radius);
    padding: 8px 10px;
    min-height: 56px;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .settings-item .label {
    flex: 1;
    font-size: 1.15rem;
    font-weight: 500;
    padding-left: 6px;
  }

  .settings-item .reorder {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .settings-footer {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
    padding-top: 12px;
  }

  .settings-footer .btn {
    width: 100%;
    border-radius: 16px;
  }

  #btn-reset-presets {
    margin-top: 8px;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    background: var(--bg-elevated);
    border: 1.5px solid rgba(126, 182, 208, 0.35);
  }

  #btn-reset-presets:active {
    background: var(--bg-press);
  }

  .modal-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(61, 58, 54, 0.35);
    z-index: 20;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: var(--bg-elevated);
    border-radius: 24px;
    padding: 24px 20px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 12px 40px var(--shadow-strong);
  }

  .modal h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
    letter-spacing: 0.06em;
    color: var(--text);
  }

  .modal .inputs-row {
    margin-bottom: 24px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .modal-actions .btn {
    flex: 1;
    border-radius: 16px;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="view active" id="view-top" role="main">
    <div class="title-wrap">
      <svg class="title-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 3.5h10" stroke="#7eb6d0" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M7 20.5h10" stroke="#7eb6d0" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M8 3.5v2.2c0 2.2 1.6 4.1 3.5 5.3C9.6 12.2 8 14.1 8 16.3v2.2" stroke="#7eb6d0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 3.5v2.2c0 2.2-1.6 4.1-3.5 5.3 1.9 1.2 3.5 3.1 3.5 5.3v2.2" stroke="#7eb6d0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10.2 12h3.6" stroke="#7eb6d0" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <h1>タイマー</h1>
    </div>
    <div class="presets" id="presets"></div>
    <div class="top-actions">
      <button type="button" class="btn" id="btn-custom">その他の時間</button>
      <button type="button" class="btn" id="btn-settings">設定</button>
    </div>
  </div>

  <div class="view" id="view-running">
    <div class="running-deco" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M7 3.5h10" stroke="#5a6b78" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M7 20.5h10" stroke="#5a6b78" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M8 3.5v2.2c0 2.2 1.6 4.1 3.5 5.3C9.6 12.2 8 14.1 8 16.3v2.2" stroke="#5a6b78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 3.5v2.2c0 2.2-1.6 4.1-3.5 5.3 1.9 1.2 3.5 3.1 3.5 5.3v2.2" stroke="#5a6b78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10.2 12h3.6" stroke="#5a6b78" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="time-display" id="time-display" aria-live="polite">00:00</div>
    <div class="running-actions">
      <button type="button" class="btn btn-accent" id="btn-pause">一時停止</button>
      <button type="button" class="btn btn-ok hidden" id="btn-resume">再開</button>
      <button type="button" class="btn btn-danger" id="btn-end">終了</button>
    </div>
  </div>

  <div class="view" id="view-alarm">
    <svg class="alarm-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 4 1.5 5.5 1.5 5.5H5s1.5-1.5 1.5-5.5z" stroke="#7eb6d0" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M10 19a2 2 0 0 0 4 0" stroke="#7eb6d0" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M12 3.5v1.2" stroke="#7eb6d0" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <div class="alarm-zero">00:00</div>
    <div class="alarm-label">時間です</div>
    <button type="button" class="btn btn-danger" id="btn-alarm-stop">停止</button>
  </div>

  <div class="view" id="view-custom">
    <div class="header-row">
      <button type="button" class="btn btn-ghost" id="btn-custom-back">← 戻る</button>
      <h1>その他の時間</h1>
      <div style="width: 64px;"></div>
    </div>
    <div class="custom-form">
      <div class="inputs-row">
        <div class="input-group">
          <label for="custom-min">分</label>
          <input type="number" id="custom-min" inputmode="numeric" min="0" max="999" value="0" aria-label="分">
        </div>
        <div class="input-group">
          <label for="custom-sec">秒</label>
          <input type="number" id="custom-sec" inputmode="numeric" min="0" max="59" value="0" aria-label="秒">
        </div>
      </div>
      <div class="custom-actions">
        <button type="button" class="btn btn-accent" id="btn-custom-start">開始</button>
      </div>
    </div>
  </div>

  <div class="view" id="view-settings">
    <div class="header-row">
      <button type="button" class="btn btn-ghost" id="btn-settings-back">← 戻る</button>
      <h1>設定</h1>
      <div style="width: 64px;"></div>
    </div>
    <div class="settings-list" id="settings-list"></div>
    <div class="settings-footer">
      <button type="button" class="btn btn-accent" id="btn-add-preset">時間を追加</button>
      <button type="button" class="btn" id="btn-reset-presets">初期設定に戻す</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 id="modal-title">時間を追加</h2>
      <div class="inputs-row">
        <div class="input-group">
          <label for="modal-min">分</label>
          <input type="number" id="modal-min" inputmode="numeric" min="0" max="999" value="5">
        </div>
        <div class="input-group">
          <label for="modal-sec">秒</label>
          <input type="number" id="modal-sec" inputmode="numeric" min="0" max="59" value="0">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btn-modal-cancel">キャンセル</button>
        <button type="button" class="btn btn-accent" id="btn-modal-save">保存</button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'timer-presets-v1';
  var SESSION_KEY = 'timer-session-v1';
  var DEFAULT_PRESETS = [
    { minutes: 3, seconds: 0 },
    { minutes: 5, seconds: 0 },
    { minutes: 10, seconds: 0 },
    { minutes: 15, seconds: 0 },
    { minutes: 20, seconds: 0 },
    { minutes: 30, seconds: 0 }
  ];

  var presets = loadPresets();
  var targetEnd = null;
  var remainingMs = 0;
  var paused = false;
  var tickId = null;
  var wakeLock = null;
  var audioCtx = null;
  var alarmNodes = null;
  var editIndex = null;

  var views = {
    top: document.getElementById('view-top'),
    running: document.getElementById('view-running'),
    alarm: document.getElementById('view-alarm'),
    custom: document.getElementById('view-custom'),
    settings: document.getElementById('view-settings')
  };
  var presetsEl = document.getElementById('presets');
  var timeDisplay = document.getElementById('time-display');
  var btnPause = document.getElementById('btn-pause');
  var btnResume = document.getElementById('btn-resume');
  var btnEnd = document.getElementById('btn-end');
  var btnAlarmStop = document.getElementById('btn-alarm-stop');
  var settingsList = document.getElementById('settings-list');
  var modalOverlay = document.getElementById('modal-overlay');

  function clonePreset(p) {
    return { minutes: p.minutes, seconds: p.seconds };
  }

  function cloneDefaults() {
    var out = [];
    for (var i = 0; i < DEFAULT_PRESETS.length; i++) {
      out.push(clonePreset(DEFAULT_PRESETS[i]));
    }
    return out;
  }

  function loadPresets() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return cloneDefaults();
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || parsed.length === 0) {
        return cloneDefaults();
      }
      var result = [];
      for (var i = 0; i < parsed.length; i++) {
        var p = parsed[i];
        var minutes = Math.max(0, Math.floor(Number(p.minutes) || 0));
        var seconds = Math.min(59, Math.max(0, Math.floor(Number(p.seconds) || 0)));
        if (minutes > 0 || seconds > 0) {
          result.push({ minutes: minutes, seconds: seconds });
        }
      }
      if (result.length === 0) return cloneDefaults();
      return result;
    } catch (e) {
      return cloneDefaults();
    }
  }

  function savePresets() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(presets));
    } catch (e) { /* ignore quota / private mode */ }
  }

  function saveSession(mode) {
    try {
      var data = {
        mode: mode,
        paused: paused,
        remainingMs: remainingMs,
        targetEnd: targetEnd,
        savedAt: Date.now()
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(data));
    } catch (e) { /* ignore */ }
  }

  function clearSession() {
    try {
      localStorage.removeItem(SESSION_KEY);
    } catch (e) { /* ignore */ }
  }

  function restoreSession() {
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return false;
      var data = JSON.parse(raw);
      if (!data || !data.mode) {
        clearSession();
        return false;
      }

      if (data.mode === 'alarm') {
        paused = false;
        remainingMs = 0;
        targetEnd = null;
        timeDisplay.textContent = '00:00';
        showView('alarm');
        return true;
      }

      if (data.mode === 'paused') {
        paused = true;
        remainingMs = Math.max(0, Number(data.remainingMs) || 0);
        targetEnd = null;
        if (remainingMs <= 0) {
          clearSession();
          return false;
        }
        btnPause.classList.add('hidden');
        btnResume.classList.remove('hidden');
        updateDisplay();
        showView('running');
        return true;
      }

      if (data.mode === 'running') {
        var end = Number(data.targetEnd) || 0;
        if (!end) {
          clearSession();
          return false;
        }
        var left = end - Date.now();
        if (left <= 0) {
          paused = false;
          remainingMs = 0;
          targetEnd = null;
          timeDisplay.textContent = '00:00';
          showView('alarm');
          saveSession('alarm');
          return true;
        }
        paused = false;
        remainingMs = left;
        targetEnd = end;
        btnPause.classList.remove('hidden');
        btnResume.classList.add('hidden');
        updateDisplay();
        showView('running');
        startTick();
        requestWakeLock();
        saveSession('running');
        return true;
      }

      clearSession();
      return false;
    } catch (e) {
      clearSession();
      return false;
    }
  }


  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function formatPresetLabel(p) {
    if (p.seconds === 0) return p.minutes + '分';
    if (p.minutes === 0) return p.seconds + '秒';
    return p.minutes + '分' + p.seconds + '秒';
  }

  function formatTime(ms) {
    var total = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(total / 60);
    var s = total % 60;
    return pad2(m) + ':' + pad2(s);
  }

  function showView(name) {
    var keys = Object.keys(views);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (k === name) {
        views[k].classList.add('active');
      } else {
        views[k].classList.remove('active');
      }
    }
  }

  function renderPresets() {
    presetsEl.innerHTML = '';
    for (var i = 0; i < presets.length; i++) {
      (function (p) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'preset-btn btn';
        btn.textContent = formatPresetLabel(p);
        btn.addEventListener('click', function () {
          var ms = (p.minutes * 60 + p.seconds) * 1000;
          startTimer(ms);
        });
        presetsEl.appendChild(btn);
      })(presets[i]);
    }
  }

  function renderSettingsList() {
    settingsList.innerHTML = '';
    for (var i = 0; i < presets.length; i++) {
      (function (p, idx) {
        var row = document.createElement('div');
        row.className = 'settings-item';

        var reorder = document.createElement('div');
        reorder.className = 'reorder';

        var up = document.createElement('button');
        up.type = 'button';
        up.className = 'btn btn-icon';
        up.textContent = '▲';
        up.setAttribute('aria-label', '上へ');
        up.disabled = idx === 0;
        up.style.opacity = idx === 0 ? '0.3' : '1';
        up.addEventListener('click', function () { movePreset(idx, -1); });

        var down = document.createElement('button');
        down.type = 'button';
        down.className = 'btn btn-icon';
        down.textContent = '▼';
        down.setAttribute('aria-label', '下へ');
        down.disabled = idx === presets.length - 1;
        down.style.opacity = idx === presets.length - 1 ? '0.3' : '1';
        down.addEventListener('click', function () { movePreset(idx, 1); });

        reorder.appendChild(up);
        reorder.appendChild(down);

        var label = document.createElement('div');
        label.className = 'label';
        label.textContent = formatPresetLabel(p);

        var edit = document.createElement('button');
        edit.type = 'button';
        edit.className = 'btn btn-icon';
        edit.textContent = '✎';
        edit.setAttribute('aria-label', '編集');
        edit.addEventListener('click', function () { openModal(idx); });

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn btn-icon';
        del.textContent = '✕';
        del.setAttribute('aria-label', '削除');
        del.style.color = 'var(--danger)';
        del.addEventListener('click', function () {
          if (presets.length <= 1) {
            alert('少なくとも1つの時間ボタンが必要です');
            return;
          }
          presets.splice(idx, 1);
          savePresets();
          renderSettingsList();
          renderPresets();
        });

        row.appendChild(reorder);
        row.appendChild(label);
        row.appendChild(edit);
        row.appendChild(del);
        settingsList.appendChild(row);
      })(presets[i], i);
    }
  }

  function movePreset(index, delta) {
    var j = index + delta;
    if (j < 0 || j >= presets.length) return;
    var tmp = presets[index];
    presets[index] = presets[j];
    presets[j] = tmp;
    savePresets();
    renderSettingsList();
    renderPresets();
  }

  function openModal(index) {
    editIndex = index;
    var title = document.getElementById('modal-title');
    var minIn = document.getElementById('modal-min');
    var secIn = document.getElementById('modal-sec');
    if (index === null) {
      title.textContent = '時間を追加';
      minIn.value = 5;
      secIn.value = 0;
    } else {
      title.textContent = '時間を編集';
      minIn.value = presets[index].minutes;
      secIn.value = presets[index].seconds;
    }
    modalOverlay.classList.add('open');
    try { minIn.focus(); } catch (e) { /* ignore */ }
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    editIndex = null;
  }

  function saveModal() {
    var m = parseInt(document.getElementById('modal-min').value, 10);
    var s = parseInt(document.getElementById('modal-sec').value, 10);
    if (isNaN(m) || m < 0) m = 0;
    if (isNaN(s) || s < 0) s = 0;
    if (s > 59) s = 59;
    if (m === 0 && s === 0) {
      alert('0より大きい時間を入力してください');
      return;
    }
    var entry = { minutes: m, seconds: s };
    if (editIndex === null) {
      presets.push(entry);
    } else {
      presets[editIndex] = entry;
    }
    savePresets();
    renderSettingsList();
    renderPresets();
    closeModal();
  }

  function requestWakeLock() {
    try {
      if (navigator.wakeLock && typeof navigator.wakeLock.request === 'function') {
        navigator.wakeLock.request('screen').then(function (lock) {
          wakeLock = lock;
          wakeLock.addEventListener('release', function () {
            wakeLock = null;
          });
        }).catch(function () { /* denied / unsupported — silent */ });
      }
    } catch (e) { /* silent fail */ }
  }

  function releaseWakeLock() {
    try {
      if (wakeLock) {
        var wl = wakeLock;
        wakeLock = null;
        var p = wl.release();
        if (p && typeof p.catch === 'function') {
          p.catch(function () { /* ignore */ });
        }
      }
    } catch (e) { /* ignore */ }
  }

  function ensureAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') {
        var p = audioCtx.resume();
        if (p && typeof p.catch === 'function') {
          p.catch(function () {});
        }
      }
      return audioCtx;
    } catch (e) {
      return null;
    }
  }

  function startAlarmSound() {
    var ctx = ensureAudio();
    if (!ctx) return;
    stopAlarmSound();

    function playBeep() {
      try {
        var t0 = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.4);

        var osc2 = ctx.createOscillator();
        var gain2 = ctx.createGain();
        osc2.type = 'square';
        osc2.frequency.value = 660;
        gain2.gain.setValueAtTime(0.0001, t0 + 0.4);
        gain2.gain.exponentialRampToValueAtTime(0.22, t0 + 0.42);
        gain2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.75);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(t0 + 0.4);
        osc2.stop(t0 + 0.8);
      } catch (e) { /* ignore audio errors — UI still runs */ }
    }

    playBeep();
    var intervalId = setInterval(playBeep, 1100);
    alarmNodes = { intervalId: intervalId };
  }

  function stopAlarmSound() {
    if (alarmNodes) {
      clearInterval(alarmNodes.intervalId);
      alarmNodes = null;
    }
  }

  function getRemaining() {
    if (paused) return remainingMs;
    if (targetEnd == null) return 0;
    return Math.max(0, targetEnd - Date.now());
  }

  function updateDisplay() {
    var ms = getRemaining();
    timeDisplay.textContent = formatTime(ms);
    if (paused) {
      timeDisplay.classList.add('paused');
    } else {
      timeDisplay.classList.remove('paused');
    }
  }

  function clearTick() {
    if (tickId != null) {
      clearInterval(tickId);
      tickId = null;
    }
  }

  function startTick() {
    clearTick();
    tickId = setInterval(onTick, 200);
  }

  function onTick() {
    syncFromWallClock();
  }

  function syncFromWallClock() {
    if (paused || targetEnd == null) {
      updateDisplay();
      return;
    }
    var ms = targetEnd - Date.now();
    if (ms <= 0) {
      timeDisplay.textContent = '00:00';
      onComplete();
      return;
    }
    updateDisplay();
  }

  function startTimer(durationMs) {
    if (durationMs <= 0) return;
    ensureAudio();
    stopAlarmSound();
    paused = false;
    remainingMs = durationMs;
    targetEnd = Date.now() + durationMs;
    btnPause.classList.remove('hidden');
    btnResume.classList.add('hidden');
    updateDisplay();
    showView('running');
    startTick();
    requestWakeLock();
    saveSession('running');
  }

  function pauseTimer() {
    if (paused || targetEnd == null) return;
    remainingMs = Math.max(0, targetEnd - Date.now());
    paused = true;
    targetEnd = null;
    clearTick();
    updateDisplay();
    btnPause.classList.add('hidden');
    btnResume.classList.remove('hidden');
    saveSession('paused');
  }

  function resumeTimer() {
    if (!paused) return;
    paused = false;
    targetEnd = Date.now() + remainingMs;
    btnPause.classList.remove('hidden');
    btnResume.classList.add('hidden');
    updateDisplay();
    startTick();
    requestWakeLock();
    saveSession('running');
  }

  function endTimer() {
    clearTick();
    stopAlarmSound();
    targetEnd = null;
    remainingMs = 0;
    paused = false;
    releaseWakeLock();
    clearSession();
    showView('top');
  }

  function onComplete() {
    clearTick();
    targetEnd = null;
    remainingMs = 0;
    paused = false;
    releaseWakeLock();
    showView('alarm');
    saveSession('alarm');
    startAlarmSound();
  }

  function stopAlarm() {
    stopAlarmSound();
    releaseWakeLock();
    clearSession();
    showView('top');
  }

  function resync() {
    if (views.running.classList.contains('active') && !paused && targetEnd != null) {
      syncFromWallClock();
      if (!wakeLock) requestWakeLock();
    }
    if (views.alarm.classList.contains('active') && !alarmNodes) {
      startAlarmSound();
    }
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      resync();
    } else if (views.alarm.classList.contains('active')) {
      saveSession('alarm');
    } else if (views.running.classList.contains('active')) {
      if (paused) saveSession('paused');
      else if (targetEnd != null) saveSession('running');
    }
  });
  window.addEventListener('pagehide', function () {
    if (views.alarm.classList.contains('active')) {
      saveSession('alarm');
    } else if (views.running.classList.contains('active')) {
      if (paused) saveSession('paused');
      else if (targetEnd != null) saveSession('running');
    }
  });
  window.addEventListener('focus', resync);
  window.addEventListener('pageshow', resync);

  document.getElementById('btn-custom').addEventListener('click', function () {
    document.getElementById('custom-min').value = 0;
    document.getElementById('custom-sec').value = 0;
    showView('custom');
  });

  document.getElementById('btn-custom-back').addEventListener('click', function () {
    showView('top');
  });

  document.getElementById('btn-custom-start').addEventListener('click', function () {
    var m = parseInt(document.getElementById('custom-min').value, 10);
    var s = parseInt(document.getElementById('custom-sec').value, 10);
    if (isNaN(m) || m < 0) m = 0;
    if (isNaN(s) || s < 0) s = 0;
    if (s > 59) s = 59;
    var ms = (m * 60 + s) * 1000;
    if (ms <= 0) {
      alert('0より大きい時間を入力してください');
      return;
    }
    startTimer(ms);
  });

  document.getElementById('btn-settings').addEventListener('click', function () {
    renderSettingsList();
    showView('settings');
  });

  document.getElementById('btn-settings-back').addEventListener('click', function () {
    renderPresets();
    showView('top');
  });

  document.getElementById('btn-add-preset').addEventListener('click', function () {
    openModal(null);
  });
  document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
  document.getElementById('btn-modal-save').addEventListener('click', saveModal);
  modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay) closeModal();
  });

  document.getElementById('btn-reset-presets').addEventListener('click', function () {
    if (!confirm('初期設定（3・5・10・15・20・30分）に戻しますか？')) return;
    presets = cloneDefaults();
    savePresets();
    renderSettingsList();
    renderPresets();
  });

  btnPause.addEventListener('click', pauseTimer);
  btnResume.addEventListener('click', resumeTimer);
  btnEnd.addEventListener('click', endTimer);
  btnAlarmStop.addEventListener('click', stopAlarm);

  try {
    document.addEventListener('gesturestart', function (e) {
      try { e.preventDefault(); } catch (err) { /* ignore */ }
    }, { passive: false });
  } catch (e) {
    try {
      document.addEventListener('gesturestart', function (e) {
        try { e.preventDefault(); } catch (err) { /* ignore */ }
      });
    } catch (e2) { /* skip if unsupported */ }
  }

  renderPresets();
  restoreSession();
})();
</script>
</body>
</html>
